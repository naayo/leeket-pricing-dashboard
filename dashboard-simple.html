<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leeket - Dashboard Pricing</title>
    <script src="auth-simple.js"></script>
    <script src="sheets-simple.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            color: #666;
            font-weight: 500;
        }

        .btn-logout {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: #d32f2f;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-title {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #333;
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-subtitle {
            color: #999;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Data Section */
        .data-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
        }

        .btn-sync {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-sync:hover {
            background: #45a049;
        }

        .btn-sync:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Products Table */
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .products-table thead {
            background: #f5f5f5;
        }

        .products-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e0e0e0;
        }

        .products-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .products-table tbody tr:hover {
            background: #f9f9f9;
        }

        .price {
            font-weight: 600;
            color: #667eea;
        }

        .margin {
            font-weight: 600;
        }

        .margin.good {
            color: #4CAF50;
        }

        .margin.average {
            color: #FF9800;
        }

        .margin.low {
            color: #f44336;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state h3 {
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Dashboard Pricing & Marges</h1>
            <div class="user-info">
                <span class="user-name" id="userName">Utilisateur</span>
                <button class="btn-logout" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">PRODUITS ANALYSÉS</div>
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-subtitle">En base de données</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">MARGE MOYENNE</div>
                <div class="stat-value" id="avgMargin">0%</div>
                <div class="stat-subtitle">Sur l'ensemble</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">PRIX MOYEN</div>
                <div class="stat-value" id="avgPrice">0 FCFA</div>
                <div class="stat-subtitle">Par produit</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">SOURCE</div>
                <div class="stat-value" id="dataSource">Local</div>
                <div class="stat-subtitle" id="sourceInfo">Données par défaut</div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="data-section">
            <div class="section-header">
                <h2 class="section-title">📦 Liste des Produits</h2>
                <button class="btn-sync" id="btnSync" onclick="syncData()" style="display:none;">
                    Synchroniser avec Google Sheets
                </button>
            </div>

            <div id="contentArea">
                <div class="loading">Chargement des données...</div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentProducts = [];
        let isLoading = false;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!AUTH.isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            // Display user info
            const user = AUTH.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.username;

                // Show sync button for admin
                if (AUTH.hasGoogleSheetsAccess()) {
                    document.getElementById('btnSync').style.display = 'inline-block';
                }
            }

            // Load data ONCE on page load
            loadDataOnce();
        });

        // Load data - called only once on page load
        async function loadDataOnce() {
            if (isLoading) return; // Prevent multiple loads
            isLoading = true;

            try {
                const products = await SHEETS.loadData();
                displayProducts(products);

                // Update source info
                if (AUTH.hasGoogleSheetsAccess()) {
                    document.getElementById('dataSource').textContent = 'Google Sheets';
                    document.getElementById('sourceInfo').textContent = 'Synchronisé';
                }
            } catch (error) {
                console.error('Error loading data:', error);
                displayError();
            } finally {
                isLoading = false;
            }
        }

        // Manual sync (admin only)
        async function syncData() {
            if (isLoading) return;
            isLoading = true;

            const btn = document.getElementById('btnSync');
            btn.disabled = true;
            btn.textContent = 'Synchronisation...';

            try {
                const products = await SHEETS.loadData();
                displayProducts(products);
                document.getElementById('sourceInfo').textContent = 'Synchronisé à ' + new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Sync error:', error);
                alert('Erreur de synchronisation');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Synchroniser avec Google Sheets';
                isLoading = false;
            }
        }

        // Display products
        function displayProducts(products) {
            currentProducts = products;

            // Update stats
            updateStats(products);

            // Create table
            const contentArea = document.getElementById('contentArea');

            if (!products || products.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <h3>Aucun produit trouvé</h3>
                        <p>Les données ne sont pas disponibles</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Catégorie</th>
                            <th>Prix de vente</th>
                            <th>Coût</th>
                            <th>Marge</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            products.forEach(product => {
                const marginClass = product.margin >= 40 ? 'good' : product.margin >= 30 ? 'average' : 'low';
                tableHTML += `
                    <tr>
                        <td><strong>${product.name}</strong></td>
                        <td>${product.category}</td>
                        <td class="price">${formatPrice(product.price)}</td>
                        <td>${formatPrice(product.cost)}</td>
                        <td class="margin ${marginClass}">${product.margin}%</td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            contentArea.innerHTML = tableHTML;
        }

        // Update statistics
        function updateStats(products) {
            if (!products || products.length === 0) {
                document.getElementById('totalProducts').textContent = '0';
                document.getElementById('avgMargin').textContent = '0%';
                document.getElementById('avgPrice').textContent = '0 FCFA';
                return;
            }

            // Total products
            document.getElementById('totalProducts').textContent = products.length;

            // Average margin
            const avgMargin = products.reduce((sum, p) => sum + parseFloat(p.margin || 0), 0) / products.length;
            document.getElementById('avgMargin').textContent = avgMargin.toFixed(0) + '%';

            // Average price
            const avgPrice = products.reduce((sum, p) => sum + (p.price || 0), 0) / products.length;
            document.getElementById('avgPrice').textContent = formatPrice(avgPrice);
        }

        // Display error
        function displayError() {
            document.getElementById('contentArea').innerHTML = `
                <div class="empty-state">
                    <h3>Erreur de chargement</h3>
                    <p>Impossible de charger les données</p>
                </div>
            `;
        }

        // Format price
        function formatPrice(price) {
            return new Intl.NumberFormat('fr-FR').format(price || 0) + ' FCFA';
        }

        // Logout
        function logout() {
            AUTH.logout();
        }
    </script>
</body>
</html>
